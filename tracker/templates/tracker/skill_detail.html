<!DOCTYPE html>
<html lang="ru">
<head>
        <style>
        .goal {
            padding: 6px 10px;
            margin-bottom: 6px;
            border-radius: 6px;
        }

        .goal-done {
            background: #e6ffe6;
            color: #2e7d32;
            text-decoration: line-through;
        }

        .goal-not-done {
            background: #fff4e5;
            color: #a15c00;
        }
    </style>
    <meta charset="UTF-8">
    <title>{{ skill.name }}</title>
</head>
<body>

<h1>{{ skill.name }}</h1>

<p>{{ skill.description }}</p>

<h2>Цели</h2>

{% if skill.goals %}
  <ul style="list-style: none; padding: 0;">
    {% for goal in skill.goals %}
      <li style="margin: 12px 0; padding: 12px; border-radius: 8px;
                 background: {% if goal.done %}#e8f5e9{% else %}#fff3e0{% endif %};
                 border: 1px solid {% if goal.done %}#a5d6a7{% else %}#ffe0b2{% endif %};">

        <a href="{% url 'goal_detail' skill_id=skill_id goal_id=goal.id %}"
           style="text-decoration: none; color: inherit; display: block;">

          <strong style="{% if goal.done %}text-decoration: line-through; color: #555;{% endif %}">
            {{ goal.text }}
          </strong>

          <br>
          <span style="color: #666; font-size: 0.95em;">
            — {{ goal.goal_description|default:"Нет описания" }}
          </span>

          {% if goal.done %}
            <span style="float: right; color: #2e7d32; font-weight: bold;">✓ Выполнено</span>
          {% endif %}

        </a>
      </li>
    {% endfor %}
  </ul>
{% else %}
  <p>Целей пока нет</p>
{% endif %}

<hr>
<a href="/">← Назад</a>

</body>
</html>
