<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Skill Tracker</title>
</head>
<body>

<h1>Skill Tracker</h1>

{% for skill_id, skill in skills.items %}
<hr>

<h2><a href="/skill/{{ skill_id }}/">{{ skill.name }}</a></h2>
<p>{{ skill.description }}</p>

{% if skill.goals %}
<p>
    {{ skill.goals.0.text }} — {{ skill.goals.0.goal_description }}
</p>
{% endif %}

<p>
    Выполнено целей:
    <strong>{{ skill.done_count }} / {{ skill.total_count }}</strong>
</p>

{% endfor %}

</body>
</html>
