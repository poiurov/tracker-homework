<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Skill Tracker</title>
    <style>
        body {
            background: #0f172a;
            color: #e2e8f0;
            font-family: system-ui, sans-serif;
            margin: 0;
            padding: 2rem;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #c084fc;
            margin-bottom: 2rem;
        }

        .skills-table {
            width: 100%;
            background: #1e293b;
            border-collapse: separate;
            border-spacing: 0 8px;
            border-radius: 12px;
            overflow: hidden;
        }

        .skills-table th,
        .skills-table td {
            padding: 14px 16px;
            text-align: left;
        }

        .skills-table thead th {
            background: #334155;
            color: #94a3b8;
            font-weight: 600;
            border-bottom: 1px solid #475569;
        }

        .skills-table tbody tr {
            background: #0f172a;
            transition: background 0.2s;
        }

        .skills-table tbody tr:nth-child(even) {
            background: #1e293b;
        }

        .skills-table tbody tr:hover {
            background: #334155;
        }

        .action-btn {
            color: #60a5fa;
            text-decoration: none;
            margin-right: 8px;
            cursor: pointer;
        }

        .action-btn:hover {
            color: #93c5fd;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Skill Tracker</h1>

        <table class="skills-table">
            <thead>
                <tr>
                    <th>Ранг</th>
                    <th>Название</th>
                    <th>Уровень</th>
                    <th>Опыт</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody>
                {% for skill in skills %}                <tr>
                    <td>{{ skill.rank }}</td> <!-- можно сделать динамическим -->
                    <td>
                        <a href="{% url 'skill_detail' skill.id %}" style="color: #e2e8f0; text-decoration: none;">
                            {{ skill.name }}
                        </a>
                    </td>
                    <td>—</td> <!-- если уровня нет — можно убрать или добавить -->
                    <td>
                        <strong>{{ skill.done_count }} / {{ skill.total_count }}</strong>
                    </td>
                    <td>
                        <a href="{% url 'goal_create' skill.id %}" class="action-btn">+</a>
                        <a href="{% url 'goals' %}" class="action-btn">список</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
