<h1>Новая цель</h1>

<p>
    Навык:
    <strong>
        <a href="{% url 'skill_detail' skill_id %}">
            {{ skill.name }}
        </a>
    </strong>
</p>

<form method="post">
    {% csrf_token %}

    <label>
        Цель:
        <input
            type="text"
            name="text"
            required
            value="{{ text|default:'' }}">

        <br><br>

        Описание:
        <input type="text" name="Description">
    </label>

    {% if error %}
    <div style="color: red; margin-top: 6px;">
        {{ error }}
    </div>
{% endif %}

    <br><br>

    <button type="submit">Создать</button>
</form>
